bundle:
  name: h_c_bundle
 
artifacts:
  harris_county_whl:
    type: whl
    path: .
    build: poetry build
 
include:
  - ./resources/pipelines/*.yml
  - ./resources/jobs/*.yml
 
variables:
  harris_catalog:
    description: Target Unity Catalog name
    default: harris_county_catalog

